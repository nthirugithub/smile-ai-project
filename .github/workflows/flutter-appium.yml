name: Appium Test Case

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test Suite to execute'
        required: true
        default: 'test:all'
        type: choice
        options:
          - 'test:all'
          - 'test:auth'
          - 'test:forms'
          - 'test:components'
          - 'test:navigation'
          - 'test:ai'

jobs:
  appium-test-case:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile-e2e-automation/package.json'

      - name: 3. Install Framework Node Dependencies
        working-directory: ./mobile-e2e-automation
        run: npm install

      - name: 4. Run Appium Test Case Suite (300 Test Cases)
        working-directory: ./mobile-e2e-automation
        run: npm run ${{ github.event.inputs.test_suite || 'test:all' }}

      - name: 5. Generate Mochawesome HTML Report
        if: always()
        working-directory: ./mobile-e2e-automation
        run: |
          if [ -f "reports/mochawesome.json" ]; then
            npx marge reports/mochawesome.json --reportDir reports --reportFilename index.html || true
          else
            echo "Creating fallback HTML report index"
            mkdir -p reports
            echo "<html><body><h1>Flutter E2E Execution Report</h1><p>Execution finished.</p></body></html>" > reports/index.html
          fi

      - name: 6. Upload E2E Artifacts & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-appium-e2e-reports
          if-no-files-found: ignore
          path: |
            mobile-e2e-automation/reports/
            mobile-e2e-automation/logs/
          retention-days: 30
