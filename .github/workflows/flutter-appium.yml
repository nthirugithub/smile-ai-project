name: Enterprise Flutter Android Appium E2E Automation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test Suite to execute'
        required: true
        default: 'test:all'
        type: choice
        options:
          - test:all
          - test:auth
          - test:forms
          - test:components
          - test:navigation
          - test:ai

jobs:
  e2e-android-flutter:
    runs-on: macos-13 # macOS runner supporting nested hardware virtualization for Android Emulator

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile-e2e-automation/package.json'

      - name: 3. Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK Environment
        uses: android-actions/setup-android@v3

      - name: 5. Install Appium 2.x & Flutter/UiAutomator2 Drivers
        run: |
          npm install -g appium@latest
          appium driver install flutter
          appium driver install uiautomator2
          appium -v
          appium driver list

      - name: 6. Install Framework Node Dependencies
        working-directory: ./mobile-e2e-automation
        run: npm ci

      - name: 7. Start Appium Server in Background
        run: |
          appium --log reports/appium_server.log --log-level info &
          sleep 5

      - name: 8. Run E2E Tests on Android Emulator (API 33)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: Pixel_6
          script: |
            adb devices
            cd mobile-e2e-automation
            npm run ${{ github.event.inputs.test_suite || 'test:all' }}

      - name: 9. Generate Mochawesome HTML Report
        if: always()
        working-directory: ./mobile-e2e-automation
        run: |
          npm run report:mochawesome || true

      - name: 10. Upload E2E Artifacts & Excel/HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-appium-e2e-reports
          path: |
            mobile-e2e-automation/reports/Flutter_E2E_Report.xlsx
            mobile-e2e-automation/reports/index.html
            mobile-e2e-automation/reports/mochawesome.json
            mobile-e2e-automation/reports/RCA_Summary.md
            mobile-e2e-automation/reports/failures/
            mobile-e2e-automation/logs/
          retention-days: 30
