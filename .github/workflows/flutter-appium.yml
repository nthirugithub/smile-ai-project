name: Appium Test Case

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test Suite to execute'
        required: true
        default: 'test:all'
        type: choice
        options:
          - 'test:all'
          - 'test:auth'
          - 'test:forms'
          - 'test:components'
          - 'test:navigation'
          - 'test:ai'

jobs:
  appium-test-case:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile-e2e-automation/package.json'

      - name: 3. Setup Python Environment for Flask Backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: 4. Install Backend Dependencies & Start Server
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          mkdir -p instance uploads reports
          python app.py &
          echo "Waiting for Flask Backend to start on port 5000..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/ > /dev/null || curl -s http://127.0.0.1:5000/login > /dev/null; then
              echo "Flask Backend is UP and running!"
              break
            fi
            sleep 1
          done

      - name: 5. Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 6. Setup Android SDK Environment
        uses: android-actions/setup-android@v3

      - name: 7. Setup Flutter SDK & Build Debug APK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 8. Build Flutter Debug APK for Appium
        working-directory: ./frontend
        run: |
          flutter pub get
          flutter build apk --debug --dart-define=DISABLE_ANIMATIONS=true --dart-define=BACKEND_URL=http://10.0.2.2:5000
          mkdir -p ../mobile-e2e-automation/app
          cp build/app/outputs/flutter-apk/app-debug.apk ../mobile-e2e-automation/app/app-release.apk

      - name: 9. Install Appium 2.x & Drivers
        run: |
          npm install -g appium@latest
          appium driver install --source=npm appium-flutter-driver
          appium driver install uiautomator2
          appium -v
          appium driver list

      - name: 10. Install Framework Node Dependencies
        working-directory: ./mobile-e2e-automation
        run: npm install

      - name: 11. Enable KVM Hardware Acceleration
        run: |
          sudo chmod 777 /dev/kvm || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true

      - name: 12. Start Appium Server in Background
        run: |
          mkdir -p mobile-e2e-automation/reports
          appium --log mobile-e2e-automation/reports/appium_server.log --log-level info &
          sleep 5

      - name: 13. Run Enterprise E2E Test Suite (300 Test Cases)
        working-directory: ./mobile-e2e-automation
        run: |
          npm run ${{ github.event.inputs.test_suite || 'test:all' }}

      - name: 14. Generate Mochawesome HTML Report
        if: always()
        working-directory: ./mobile-e2e-automation
        run: |
          if [ -f "reports/mochawesome.json" ]; then
            npx marge reports/mochawesome.json --reportDir reports --reportFilename index.html || true
          else
            echo "Creating fallback HTML report index"
            mkdir -p reports
            echo "<html><body><h1>Flutter E2E Execution Report</h1><p>Execution finished.</p></body></html>" > reports/index.html
          fi

      - name: 15. Upload E2E Artifacts & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-appium-e2e-reports
          if-no-files-found: ignore
          path: |
            mobile-e2e-automation/reports/
            mobile-e2e-automation/logs/
          retention-days: 30
