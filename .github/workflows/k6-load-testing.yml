name: load test

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'load-testing/**'
      - '.github/workflows/k6-load-testing.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'load-testing/**'
      - '.github/workflows/k6-load-testing.yml'
  workflow_dispatch:
    inputs:
      vus:
        description: 'Number of Virtual Users (VUs)'
        required: false
        default: '100'
      duration:
        description: 'Test Duration (e.g. 1m)'
        required: false
        default: '1m'

jobs:
  k6-load-test:
    name: load test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python Environment for Flask Backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: 3. Install Backend Dependencies & Start Flask Server
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          mkdir -p instance uploads reports
          python app.py &
          echo "Waiting for Flask Backend to start on port 5000..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/health > /dev/null || curl -s http://127.0.0.1:5000/ > /dev/null; then
              echo "Flask Backend is UP and healthy on http://127.0.0.1:5000!"
              break
            fi
            sleep 1
          done

      - name: 4. Install K6 & Execute Load Test (100 VUs / 1 min)
        run: |
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69 || true
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update || true
          sudo apt-get install -y k6
          k6 run --env BASE_URL=http://127.0.0.1:5000 load-testing/baseline_load_test.js

      - name: 5. Upload K6 Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-results
          path: load-testing/
          retention-days: 30
