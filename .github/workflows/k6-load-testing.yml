name: K6 Load Testing

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      vus:
        description: 'Number of Virtual Users (VUs)'
        required: false
        default: '100'
      duration:
        description: 'Test Duration (e.g. 1m)'
        required: false
        default: '1m'

jobs:
  k6-load-test:
    name: K6 Backend Baseline Load Testing
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python Environment for Flask Backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: 3. Install Backend Dependencies & Start Flask Server
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          mkdir -p instance uploads reports
          python app.py &
          echo "Waiting for Flask Backend to start on port 5000..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/health > /dev/null || curl -s http://127.0.0.1:5000/ > /dev/null; then
              echo "Flask Backend is UP and healthy on http://127.0.0.1:5000!"
              break
            fi
            sleep 1
          done

      - name: 4. Execute K6 Load Test (100 VUs / 1 min)
        uses: grafana/k6-action@v0.0.5
        with:
          filename: load-testing/baseline_load_test.js
          flags: --env BASE_URL=http://127.0.0.1:5000

      - name: 5. Upload K6 Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-results
          path: load-testing/
          retention-days: 30
