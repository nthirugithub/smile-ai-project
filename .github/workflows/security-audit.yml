name: Security Controls & Audit Test

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/security-audit.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/security-audit.yml'
  workflow_dispatch:

jobs:
  security-controls-audit:
    name: Security Posture Audit (200 Test Cases)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: 3. Install Dependencies & Start Flask Backend
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          mkdir -p instance uploads reports
          python app.py &
          echo "Waiting for Flask Backend to start on port 5000..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/health > /dev/null || curl -s http://127.0.0.1:5000/ > /dev/null; then
              echo "Flask Backend is UP and healthy on http://127.0.0.1:5000!"
              break
            fi
            sleep 1
          done

      - name: 4. Run Security Posture Audit Suite (200 Test Cases)
        working-directory: ./backend
        run: |
          python -m pytest test_security_controls.py --html=reports/security_test_report.html --self-contained-html

      - name: 5. Upload Security Audit HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: backend/reports/security_test_report.html
          retention-days: 30
